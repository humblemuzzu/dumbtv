# Expected state for the panel's TV health row. Copy to quick/expected.conf (git-ignored), fill in
# your TV's values, and quick/install.sh pushes it to
# /sdcard/Android/media/tv.dumbtv.quick/expected.conf. Without that file the row stays hidden.
# The row then warns when the TV drifts: a Fire OS update, a debloated app enabled again, a
# setting reset, or dumbtv home's Guard no longer the accessibility service.

# adb shell getprop ro.build.display.id
build=RS0000.0000N
accessibility=tv.dumbtv.home/tv.dumbtv.home.Guard

# Packages dumbtv disabled (report/debloat.txt), comma-separated.
disabled_packages=com.amazon.tv.acr,com.amazon.sneakpeek

# setting.<secure|system|global>.<name>=<value>, as `adb shell settings get` prints it.
setting.secure.limit_ad_tracking=1
setting.secure.screensaver_enabled=1
