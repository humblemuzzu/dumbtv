quirks:
  - "If the TV screen goes to sleep, wake it before continuing ADB-controlled setup."
  - "Keep com.amazon.firebat: it is Prime Video on this build."
  - "Projectivy keeps its default visual layout. Its top Ajustes > Ajustes de Android menu opens native Fire TV Settings; the screen stayed open for five seconds and HOME returned to Projectivy. No Settings helper is needed."
