  - "The pass initially disabled 57 listed components. After reboot, 44 packages remained disabled including stock YouTube; 14 listed packages re-enabled themselves."
  - "DNSFILTER=0 and SYSTEM_DNS=0 leave the DNS app and VPN unconfigured. LAUNCHER=0 skips dumbtv home; Projectivy is configured separately."
notes: "Fire OS 8.1.8.5 (Android 11, SDK 30, ARMv7). Projectivy 4.72, Stremio Android TV 1.10.4 and SmartTube 32.68 installed. Existing streaming apps stay enabled. DNS filtering is intentionally off. verify.sh exited 0 with DNS and built-in launcher checks skipped; separate runtime tests verified Projectivy HOME, startup after reboot, and native Settings. Playback and audio were not tested."
