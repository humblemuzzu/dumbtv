id: fireos-amazon-aftkrt
title: "Amazon Fire TV Stick 4K Max, 2nd gen (AFTKRT)"
contributors:
  - gerardo-galvez-hl
  - derkstample
  - aboubakrine
  - s-razaq
platform: fireos
status: tested
tested_on: "RS8182.3811N (first unit, partial); RS8185.3891N (second unit, full pass); RS8185.3891N (third unit, full pass with dumbtv home); RS8185.3891N (fourth unit, full pass with dumbtv home 1.6)"
models:
  - "AFTKRT (Fire TV Stick 4K Max 2nd gen; codename karat)"
adb:
  port: 5555
  transport: wifi
developer_mode: >-
  Settings > My Fire TV > About > click the device name 7 times, then My Fire TV > Developer Options > ADB debugging: ON (second unit; on the first it was already enabled)
ip_location: "Settings > My Fire TV > About > Network"
prompts:
  - name: "USB debugging authorization"
    blocks_automation: true
    fix: "human presses Allow on the TV on the first adb connect from a new machine; tick Always allow"
  - name: "Fire TV full-screen keyboard"
    blocks_automation: true
    fix: "com.amazon.tv.ime opens over personalDNSfilter's text fields and swallows remote input. Tap the right end of the field, send the deletes in one adb shell input keyevent 67 67 67 call, type with adb shell input text, then KEYCODE_BACK before the next tap"
data:
  packages: data/fireos/packages.txt
  protected: data/fireos/protected.txt
  never_disable: data/fireos/never-disable.txt
  user_apps: data/fireos/user-apps.txt
quirks:
  - "Different model from catalog/devices/fireos-amazon-aftkm.yaml (issue #8) but the same codename (karat) and build (RS8182.3811N, Fire OS 8.1.8.2), so the Fire OS 8 findings there (Android/data unreachable from adb) most likely apply here too. dnsfilter.sh and launcher.sh were not run on the first unit; the second unit (below) confirms the Android/data finding. The Fire OS 8 HOME fix in launcher 1.2 was confirmed on an AFTKRT by its author (PR #49)"
  - "debloat.sh printed 'no cmd package install-existing' although the command exists (line 120 of cmd package help): need_device runs adb shell 'cmd package help' | grep -q install-existing under set -o pipefail; grep -q exits on the first match, adb gets a broken pipe and returns 255, so REINSTALL=0. Reproduced 5/5 with pipefail, 3/3 succeed without it. Timing-dependent: the issue #8 run on the same build detected it (10 removed). Harmless here, every package was disabled instead of uninstalled"
  - "debloat.sh: 0 removed, 58 disabled, 0 protected, 0 suspect, 9 absent (none of the regional user apps are installed). com.amazon.ceviche and com.amazon.neo.minerva.logcat kept running after disable-user and were starved; after a reboot ceviche stays stopped but minerva.logcat is running again while still disabled"
  - "Unlike issue #8, com.amazon.dummy.settings and com.android.traceur were still disabled after a reboot here (both were disabled, not uninstalled)"
  - "lockdown.sh: device.metrics, crashmanager, ftvads.deeplinking, tv.csapp, software.ota and ota.override all accepted RUN_ANY_IN_BACKGROUND ignore and the background-data blacklist; device.rdmapplication is absent"
  - "com.amazon.vizzini had been disabled weeks earlier with pm disable-user by another debloat tool and was found enabled again, consistent with keeping it in never-disable.txt"
  - "Not caused by dumbtv, but easy to blame on it: Plex for Fire TV 2026.20.0 (targetSdk 36) is denied the sticky HDMI_AUDIO_PLUG broadcast (Permission Denial ... DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION), cannot detect passthrough, bans the audio codec ('Audio codec banned on device') and transcodes TrueHD to EAC3. Fix in the app: Settings > Audio > Passthrough: HDMI with TrueHD and EAC3 enabled"
  - "Second unit, Fire OS 8.1.8.5 (RS8185.3891N): all.sh with PRIME=1, ALEXA=0, LAUNCHER=0. debloat.sh: 51 disabled, 0 protected, 0 suspect; com.amazon.neo.minerva.logcat, com.amazon.tv.developer.dataservice and com.amazon.whad kept running after disable-user and were starved"
  - "DNS filter on Fire OS 8: Android/data is hidden from adb, so dnsfilter.sh pushes the list to /sdcard/Android/media/dnsfilter.android/ and stops at its one manual step. The app had written its default config (1Hosts-light, StevenBlack ad&malware and HageziPro active, 7-day interval), and nothing was blocked: softwareupdates.amazon.com resolved to a public address"
  - "personalDNSfilter renders its portrait phone layout on this stick and the remote cannot reliably move through it. It was driven over adb instead: uiautomator dump for the bounds, adb shell input tap at the 1920x1080 override size. Advanced settings > Configure filter update: interval 3650; untick 1Hosts-light, ad&malware and HageziPro; the Category arrows to All categories, scroll to the end, the edit button on the <new> row; category custom, name dumbtv, URL file:///storage/emulated/0/Android/media/dnsfilter.android/dumbtv-blocklist.txt, tick Active, OK. Collapse both panels, then RESTART. The log reads Building index for 410 entries, 397 unique, next filter reload in 2036"
  - "The filter survived a reboot: tun0 was up and always_on_vpn_app still dnsfilter.android within a minute of boot, without opening the app"
  - "Third unit, Fire OS 8.1.8.5 (RS8185.3891N): PRIME=0, ALEXA=0, LAUNCHER=1, DNSFILTER=1, YOUTUBE=1, one user app named for removal. debloat.sh: 49 disabled, 0 protected, 0 suspect, 6 absent, 1 app uninstalled; com.amazon.neo.minerva.logcat, com.amazon.device_remote_config_sync_service and com.amazon.whad kept running after disable-user and were starved"
  - "Third unit: the adb restore of the filter config cannot work. 'service check backup' prints 'Service backup: found', but 'bmgr enabled' says 'Backup Manager is not activated for user 0' and 'dumpsys backup' prints Inactive. dnsfilter.sh printed 'adb restore ended before the TV showed its confirmation' and stopped at the manual step. A check on 'service check backup' alone would not catch this unit; 'bmgr enabled' would"
  - "Third unit: the manual step was driven over adb as on the second unit. With Configure filter update open, the Category arrows go to All categories, and the <new> row is last after scrolling the table; category custom, name dumbtv, the file:/// URL, tick Active, OK; interval 3650; untick 1Hosts-light, ad&malware and HageziPro; collapse both panels, then RESTART. Log: Building index for 416 entries, 403 unique, next filter reload in 2036. tun0 was up after the reboot without opening the app"
  - "Third unit: launcher.sh installed dumbtv home 1.5 and took HOME on the first run (accessibility Guard and min_futurity=0). verify.sh home and home-key checks passed after a reboot"
  - "Third unit: youtube.sh on a stick without com.amazon.firetv.youtube installed SmartTube 32.56 and then printed 'could not launch SmartTube: ** SYS_KEYS has no physical keys', the known monkey quirk when the remote is asleep. Harmless: SmartTube was installed (versionCode 2446)"
  - "Fourth unit, Fire OS 8.1.8.5 (RS8185.3891N): defaults (PRIME=1, ALEXA=1, LAUNCHER=1, DNSFILTER=1, YOUTUBE=0). debloat.sh: 34 disabled, 0 protected, 0 suspect, 4 absent; com.amazon.neo.minerva.logcat and com.amazon.tv.developer.dataservice kept running after disable-user and were starved"
  - "Fourth unit: backup service is off, so dnsfilter.sh fell back to configure_in_app (typing the config into personalDNSfilter's editor). Pressing KEYCODE_BACK after typing saved the config, closed DNSProxyActivity and automatically restarted the filter (log: Building index for 395 entries, 382 unique, next filter reload in 2036), so ui_press startBtn printed 'could not press the app's RESTART' even though the list was already loaded and active"
  - "Fourth unit: Android Private DNS (private_dns_mode=hostname with a DNS-over-TLS host) had been set before dumbtv ran. On reboot, the stick's clock starts before NTP sync (Oct 10, 2026), which was earlier than the DoT server's TLS certificate notBefore date (Oct 20, 2026); Android marked Private DNS broken on both wlan0 and tun0 and refused all DNS lookups (including NTP). Turning it off with 'adb shell settings put global private_dns_mode off' restored lookups immediately, synced the clock over NTP on boot, and let personalDNSfilter filter DNS across reboots"
  - "Fourth unit: launcher.sh installed dumbtv home 1.6 (taking over HOME from Projectivy Launcher) and verify.sh exited 0 before and after a reboot"
notes: "Four units. Fourth unit, Fire OS 8.1.8.5 (RS8185.3891N): full pass with defaults (dumbtv home 1.6 and personalDNSfilter via configure_in_app after turning off global private_dns_mode); verify.sh exit 0 before and after a reboot. Third unit, Fire OS 8.1.8.5 (RS8185.3891N): the full pass with dumbtv home, the DNS filter (set up by hand: no backup service for user 0) and SmartTube; verify.sh exit 0 before and after a reboot. Second unit, Fire OS 8.1.8.5 (RS8185.3891N): debloat, lockdown and the DNS filter through the file:/// list, verify.sh exit 0 before and after a reboot; launcher.sh not run (LAUNCHER=0 by the owner's choice). Fire OS 8.1.8.2 (RS8182.3811N): debloat and lockdown only, DNS filtering done network-wide by Pi-hole"
verify:
  blocked: data/blocklists/verify-blocked.txt
  allowed: data/blocklists/verify-allowed.txt
