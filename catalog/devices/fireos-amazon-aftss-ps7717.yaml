id: fireos-amazon-aftss-ps7717
title: "Amazon Fire TV Stick HD, 2024 (AFTSS), PS7717.5746N"
contributors:
  - GerritD
platform: fireos
status: tested
tested_on: "PS7717.5746N"
models:
  - "AFTSS (sold as Fire TV Stick HD 1st gen 2024)"
adb:
  port: 5555
  transport: wifi
developer_mode: >-
  Settings > My Fire TV > About > press OK on the device name 7 times, then My Fire TV > Developer Options > ADB debugging: ON. With parental controls on, the PIN was asked before Developer Options could be reached
ip_location: "Settings > My Fire TV > About > Network"
prompts:
  - name: "USB debugging authorization"
    blocks_automation: true
    fix: "tick Always allow from this computer, press Allow on the remote"
  - name: "Parental controls PIN before Developer Options"
    blocks_automation: true
    fix: "the PIN is the Amazon account's Prime Video PIN; reset it in the Prime Video app on a phone signed in to the same Amazon account"
data:
  packages: data/fireos/packages.txt
  protected: data/fireos/protected.txt
  never_disable: data/fireos/never-disable.txt
  user_apps: data/fireos/user-apps.txt
quirks:
  - "Holding Back + Right on the remote is Fire OS's factory-reset shortcut, not a PIN reset. An owner stuck at the parental-controls PIN tried it; reset the PIN from the Amazon account instead"
  - "svc power reboot restarted the stick on the first request in both reboots (debloat.sh and dnsfilter.sh), with no 'asking again'; the retry seen on the first unit is not universal"
notes: "Fourth AFTSS, Fire TV Stick HD (2024), build PS7717.5746N: the full pass with SmartTube, Prime Video and Alexa kept. debloat 35 disabled, 0 protected, 0 suspect; lockdown restricted 7 protected packages; the filter at 394 entries blocked the update and telemetry hosts; dumbtv home 1.11 bound and HOME lands on it; verify.sh exited 0"
verify:
  blocked: data/blocklists/verify-blocked.txt
  allowed: data/blocklists/verify-allowed.txt
