id: fireos-toshiba-aftha004
title: "Toshiba Fire TV Edition (AFTHA004)"
contributors:
  - jonhay
platform: fireos
status: tested
tested_on: "PS7717.5746N"
models:
  - "AFTHA004 (Toshiba Fire TV Edition)"
adb:
  port: 5555
  transport: wifi
developer_mode: >-
  Settings > My Fire TV > About > click the device name 7 times, then My Fire TV > Developer Options > ADB debugging: ON
ip_location: "Settings > Network"
prompts:
  - name: "Allow USB debugging?"
    blocks_automation: true
    fix: "press Allow on the TV and tick Always allow"
data:
  packages: data/fireos/packages.txt
  protected: data/fireos/protected.txt
  never_disable: data/fireos/never-disable.txt
  user_apps: data/fireos/user-apps.txt
quirks:
  - "Reports as AFTHA004 like the Hisense entry, but this unit is sold as a Toshiba Fire TV Edition."
  - "com.amazon.neo.minerva.logcat and com.amazon.tv.developer.dataservice kept running after being disabled; debloat.sh cut their background work as designed."
notes: "all.sh with PRIME=1 ALEXA=0 LAUNCHER=1 DNSFILTER=1 YOUTUBE=1: debloat disabled 50, protected 0, suspect 0; 13 privacy settings, filter 412 entries, dumbtv home 1.11, SmartTube installed; verify.sh exited 0 with all checks passing."
verify:
  blocked: data/blocklists/verify-blocked.txt
  allowed: data/blocklists/verify-allowed.txt
