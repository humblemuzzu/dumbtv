id: fireos-xiaomi-aftbr92d74
title: "Xiaomi TV F Pro 75 Fire TV (AFTBR92D74)"
contributors:
  - Jeff909Dev
platform: fireos
status: tested
tested_on: "RS8185.3885N"
models:
  - "Xiaomi TV F Pro 75 (L75MB-FPEU)"
adb:
  port: 5555
  transport: wifi
developer_mode: >-
  Settings > My Fire TV > About > press OK on the device name 7 times, then My Fire TV > Developer Options > ADB debugging
ip_location: "Settings > Network: the list of networks does not show it; highlight the connected network and press Play/Pause for its status screen"
prompts:
  - name: "Allow USB debugging?"
    blocks_automation: true
    fix: "Press Allow and tick Always allow from this computer on the TV"
data:
  packages: data/fireos/packages.txt
  protected: data/fireos/protected.txt
  never_disable: data/fireos/never-disable.txt
  user_apps: data/fireos/user-apps.txt
quirks:
  - "ADB debugging was found switched off after reboots (port 5555 refused although the TV reached its home screen). debloat.sh stopped with 'device did not report boot_completed'; the owner turned ADB debugging back on in Developer Options and the pass continued with lockdown.sh"
  - "The router answered no DNS queries (the network hands out the ISP's resolvers). With DNS_UPSTREAM empty, verify.sh failed every allowed host with 'no answer' and SmartTube showed 'Unable to resolve host' until DNS_UPSTREAM was set to public resolvers (Cloudflare and Quad9) and dnsfilter.sh was run again. Same symptom as the Xiaomi AFTANNA0"
  - "dnsfilter.sh's own self-test reported www.youtube.com allowed on that first run, so the DNS problem only showed up in verify.sh"
  - "launcher.sh bound HOME on the first run"
  - "verify.sh's home-key check failed once while SmartTube's sign-in screen was in front right after youtube.sh; it passed after the next reboot"
notes: "Full pass with PRIME=1, ALEXA=1, LAUNCHER=1, DNSFILTER=1, YOUTUBE=1 and DNS_UPSTREAM set to public resolvers: debloat.sh 33 disabled, 0 protected, 4 absent, 0 suspect; lockdown.sh restricted 6 protected packages; verify.sh all checks passed with 34 packages disabled (including the stock YouTube app), HOME on dumbtv home 1.7 and personalDNSfilter owning the VPN"
verify:
  blocked: data/blocklists/verify-blocked.txt
  allowed: data/blocklists/verify-allowed.txt
