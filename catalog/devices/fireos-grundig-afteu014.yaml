id: fireos-grundig-afteu014
title: "Grundig 50 UHD AGA Fire TV Edition (AFTEU014), Fire OS 7.6.8.5"
contributors:
  - mzmonkey
platform: fireos
status: tested
tested_on: "PS7685.4487N"
models:
  - "AFTEU014 (Grundig 50 UHD AGA, Fire TV Edition)"
adb:
  port: 5555
  transport: wifi
developer_mode: >-
  Settings > My Fire TV > About > press OK on the device name 7 times, then My Fire TV > Developer Options > ADB debugging: ON
ip_location: "Settings > My Fire TV > About > Network"
prompts:
  - name: "USB debugging authorization"
    blocks_automation: true
    fix: "human presses Allow on the TV; tick Always allow from this computer"
data:
  packages: data/fireos/packages.txt
  protected: data/fireos/protected.txt
  never_disable: data/fireos/never-disable.txt
  user_apps: data/fireos/user-apps.txt
quirks:
  - "No package in packages.txt was refused as protected. Absent on this model: shoptv.firetv.client, media.recommendations, perfc, neo.minerva.logcat, device_remote_config_sync_service, alexadirectivebrokerservice, firetv.androidskillconnectioncapability, rtcsessioncontroller, smarthomemapviewapp, whad, whasettings"
  - "com.android.nfc ships disabled by the system; debloat.sh reports it as system-disabled"
  - "DNS filter came up by itself after dnsfilter.sh's reboot (tun0 owned by personalDNSfilter); no manual restart was needed"
  - "Launcher: the accessibility HOME takeover works; HOME lands on dumbtv home"
notes: "Fire OS 7.6.8.5 (Android 9) on a Grundig Fire TV Edition TV: debloat, lockdown, DNS filter, launcher and SmartTube all ran unchanged with Alexa off and Prime kept; verify.sh passed every check."
verify:
  blocked: data/blocklists/verify-blocked.txt
  allowed: data/blocklists/verify-allowed.txt
